  <script>
    // CONDITION INITIALIZATION — declare only
    let CONDITION = null;
    // rdk plugin
    (function(){
      var plugin = {};
      plugin.info = {
        name: 'rdk',
        parameters: {
          choices: {type: jsPsych.plugins.parameterType.KEYCODE, default: []},
          correct_choice: {type: jsPsych.plugins.parameterType.STRING, default: null},
          trial_duration: {type: jsPsych.plugins.parameterType.INT, default: -1},
          response_ends_trial: {type: jsPsych.plugins.parameterType.BOOL, default: true},
          number_of_apertures: {type: jsPsych.plugins.parameterType.INT, default: 1},
          number_of_dots: {type: jsPsych.plugins.parameterType.INT, array: true, default: 100},
          coherence: {type: jsPsych.plugins.parameterType.FLOAT, array: true, default: 0},
          coherent_direction: {type: jsPsych.plugins.parameterType.FLOAT, array: true, default: 0},
          aperture_width: {type: jsPsych.plugins.parameterType.INT, array: true, default: 160},
          aperture_type: {type: jsPsych.plugins.parameterType.INT, default: 1},
          aperture_center_x: {type: jsPsych.plugins.parameterType.FLOAT, array: true, default: []},
          aperture_center_y: {type: jsPsych.plugins.parameterType.FLOAT, array: true, default: []},
          aperture_labels: {type: jsPsych.plugins.parameterType.STRING, array: true, default: []},
          speed: {type: jsPsych.plugins.parameterType.FLOAT, array: true, default: null}
        }
      };

      function asArray(x, N) {
        if (Array.isArray(x)) return x.slice(0, N).concat(Array(Math.max(0, N - x.length)).fill(x[x.length-1]));
        return Array(N).fill(x);
      }

      const DEFAULT_DOT_SPEED = 120; // px/sec

      plugin.trial = function(display_element, trial) {
        const N = trial.number_of_apertures;
        const widths   = asArray(trial.aperture_width, N);
        const centersX = asArray(trial.aperture_center_x, N);
        const centersY = asArray(trial.aperture_center_y, N);
        const numDots  = asArray(trial.number_of_dots, N);
        const coherence= asArray(trial.coherence, N);
        const dirDeg   = asArray(trial.coherent_direction, N);
        const baseSpeed = (trial.speed === null || typeof trial.speed === 'undefined')
          ? DEFAULT_DOT_SPEED
          : trial.speed;
        const speeds   = asArray(baseSpeed, N).map(val => {
          const num = Number(val);
          if (!Number.isFinite(num)) return DEFAULT_DOT_SPEED;
          return Math.max(0, num);
        });
        const RESPONSE_LOCKOUT = 1000 + N * 125

      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      const pb = document.getElementById('jspsych-progressbar-container');
      const pbH = pb ? pb.offsetHeight : 0;
      const w = window.innerWidth;
      const h = window.innerHeight;

      display_element.style.margin = '0';
      display_element.style.padding = '0';
      display_element.style.overflow = 'hidden';

      // ADD THIS
      const trialInstruction =
        CONDITION === "coherent"
          ? "Click on the circle you're most certain contains coherent motion."
          : "Click on the circle you're most certain does not contain coherent motion.";

      display_element.innerHTML = `
        <div id="rdk-wrap" style="position:relative;width:${w}px;height:${h}px;margin:0 auto;padding:0;">

          <canvas id="rdk-canvas"
                  width="${w}"
                  height="${h}"
                  style="display:block;width:${w}px;height:${h}px;margin:0;padding:0;">
          </canvas>

          <div id="trial-instruction"
              style="
                position:absolute;
                bottom:20px;
                left:50%;
                transform:translateX(-50%);
                background:rgba(0,0,0,0.75);
                color:white;
                opacity: 0.25;
                padding:12px 24px;
                border-radius:12px;
                font-size:18px;
                text-align:center;
                max-width:80%;
                pointer-events:none;
                z-index:1000;">
            ${trialInstruction}
          </div>

        </div>
      `;

      const canvas = display_element.querySelector('#rdk-canvas');
      const instructionBox = display_element.querySelector('#trial-instruction')
      const wrap = display_element.querySelector('#rdk-wrap');
      const ctx = canvas.getContext('2d');

        const apertures = [];
        const labels = Array.isArray(trial.aperture_labels) ? trial.aperture_labels : [];
        function normalizeLabel(value, idx){
          if (typeof value === 'number' && Number.isFinite(value)) return value;
          if (typeof value === 'string' && value.trim() !== '') {
            const num = Number(value);
            if (Number.isFinite(num)) return num;
            return value.trim();
          }
          return idx + 1;
        }
        const dotRadius = 1.5;
        function randAngle(){ return Math.random()*Math.PI*2; }

        for (let a = 0; a < N; a++) {
          const radius = widths[a] / 2;
          const cx = centersX[a] || w/2;
          const cy = centersY[a] || h/2;
          const nd = numDots[a] || 100;
          const coh = Math.max(0, Math.min(1, coherence[a] || 0));
          const nCoh = Math.round(nd * coh);

          const dots = [];
          for (let i=0;i<nd;i++){
            const r = radius * Math.sqrt(Math.random());
            const th = Math.random()*Math.PI*2;
            const x = cx + r*Math.cos(th);
            const y = cy + r*Math.sin(th);
            const coherent = i < nCoh;
            const theta = coherent ? (dirDeg[a]||0) * Math.PI/180 : randAngle();
            dots.push({x,y,theta,coherent});
          }
          for (let i=dots.length-1;i>0;i--){
            const j = Math.floor(Math.random()*(i+1));
            [dots[i],dots[j]] = [dots[j],dots[i]];
          }
          const label = normalizeLabel(labels[a], a);
          apertures.push({cx,cy,radius,dots,index:a,label,speed:speeds[a]});
        }

        let startTime = performance.now(), rafId=null, responded=false, lastFrameTime=null;

        function step(now) {
          if (responded) return;
          const timestamp = (typeof now === 'number') ? now : performance.now();
          if (lastFrameTime === null) {
            lastFrameTime = timestamp;
          }
          let dt = (timestamp - lastFrameTime) / 1000;
          lastFrameTime = timestamp;
          if (!Number.isFinite(dt) || dt <= 0) dt = 0;
          const cappedDt = Math.min(dt, 0.1);

          ctx.clearRect(0,0,w,h);
          for (let a=0;a<N;a++){
            const A = apertures[a];

            
            ctx.save();
            ctx.beginPath(); ctx.arc(A.cx, A.cy, A.radius, 0, Math.PI*2); ctx.clip();
            for (let d of A.dots){
              if (!d.coherent) {
                const wander = (Math.random() - 0.5) * 0.5 * (cappedDt / (1/60));
                d.theta += wander;
              }
              const move = A.speed * cappedDt;
              d.x += move * Math.cos(d.theta);
              d.y += move * Math.sin(d.theta);
              const dx=d.x-A.cx, dy=d.y-A.cy;
              if (Math.hypot(dx,dy) > A.radius){
                if (d.coherent) {
                  d.theta = (dirDeg[a]||0) * Math.PI/180;
                } else {
                  d.theta = randAngle();
                }
                const rr = A.radius * Math.sqrt(Math.random());
                const tt = Math.random()*Math.PI*2;
                d.x = A.cx + rr*Math.cos(tt);
                d.y = A.cy + rr*Math.sin(tt);
              }
              ctx.beginPath(); ctx.arc(d.x, d.y, dotRadius, 0, Math.PI*2);
              ctx.fillStyle = "#e6e6e6"; ctx.fill();
            }
            ctx.restore();

            
            ctx.beginPath();
            ctx.arc(A.cx, A.cy, A.radius, 0, Math.PI*2);
            ctx.strokeStyle = "rgba(255,255,255,0.25)";
            ctx.lineWidth = 2;
            ctx.stroke();

          }
          if (!responded) rafId = requestAnimationFrame(step);
        }
        rafId = requestAnimationFrame(step);

        const validKeys = Array.isArray(trial.choices)
          ? trial.choices.map(k => (typeof k==='number'?jsPsych.pluginAPI.convertKeyCodeToKeyCharacter(k):k).toLowerCase())
          : [];
        const end_trial = (info) => {
          responded = true;
          if (rafId) cancelAnimationFrame(rafId);
          if (kbListener) jsPsych.pluginAPI.cancelKeyboardResponse(kbListener);
          try { canvas.removeEventListener('pointerdown', onPointerDown); } catch(e){}
          try { jsPsych.pluginAPI.clearAllTimeouts(); } catch(e){}
          const rt = info ? info.rt : Math.round(performance.now()-startTime);
          let chosen = null;
          if (info) {
            if (Object.prototype.hasOwnProperty.call(info, 'chosen')) {
              chosen = info.chosen;
            } else if (Object.prototype.hasOwnProperty.call(info, 'key')) {
              chosen = info.key;
            }
          }
          const chosenStr = (chosen !== null && typeof chosen !== 'undefined') ? String(chosen).trim() : null;
          
          let correct = null;

          if (chosenStr !== null && trial.correct_choice !== null && trial.correct_choice !== undefined) {
            if (Array.isArray(trial.correct_choice)) {
              // multiple correct answers
              correct = trial.correct_choice.map(String).includes(chosenStr);
            } else {
              // single correct answer
              correct = (chosenStr === String(trial.correct_choice));
            }
          }

          // condition-dependent correctness inversion
          if (CONDITION === "noise" && correct !== null) {
            correct = !correct;
          }
          display_element.innerHTML = '';
          display_element.removeAttribute('style');
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
          const numericPattern = /^-?\d+(\.\d+)?$/;
          const chosenValue = (chosenStr !== null && numericPattern.test(chosenStr)) ? Number(chosenStr) : chosenStr;
          jsPsych.finishTrial({ rt, chosen_circle: chosenValue, correct, m: N, coh_dir_deg: trial._coh_dir_deg });
        };

        const kbListener = (validKeys.length > 0)
          ? jsPsych.pluginAPI.getKeyboardResponse({
              callback_function: end_trial,
              valid_responses: validKeys,
              rt_method: 'performance', persist: false, allow_held_key: false
            })
          : null;

        const rect = () => canvas.getBoundingClientRect();
        function toCanvasXY(e){
          const r = rect();
          const scaleX = canvas.width / r.width;
          const scaleY = canvas.height / r.height;
          return {
            x: (e.clientX - r.left) * scaleX,
            y: (e.clientY - r.top) * scaleY
          };
        }
        function onPointerDown(e){
          if (responded) return;
          const elapsed = performance.now() - startTime
          if (elapsed < RESPONSE_LOCKOUT){
            return; // prevents trials from ending if under response lockout
          }
          const p = toCanvasXY(e);
          for (let a=0;a<N;a++){
            const A = apertures[a];
            if (Math.hypot(p.x - A.cx, p.y - A.cy) <= A.radius){
              end_trial({ rt: Math.round(performance.now()-startTime), chosen: A.label });
              return;
            }
          }
        }
        canvas.style.cursor = 'pointer';
        canvas.addEventListener('pointerdown', onPointerDown);
      
        // make instruction box text brighter when participant is able to click
        jsPsych.pluginAPI.setTimeout(() => { if (!responded && instructionBox) instructionBox.style.opacity = "1"; }, RESPONSE_LOCKOUT);

        if (trial.trial_duration > 0) {
          jsPsych.pluginAPI.setTimeout(() => { if (!responded) end_trial(null); }, trial.trial_duration);
        }
      };

      jsPsych.plugins['rdk'] = plugin;
    })();
  </script>
  <script>
    // prolific params
    const prolificParams = {
        subject_id:
        jsPsych.data.getURLVariable('PROLIFIC_PID') ||
        (window.jatos && jatos.urlQueryParameters && jatos.urlQueryParameters.PROLIFIC_PID) ||
        null,
        study_id:
        jsPsych.data.getURLVariable('STUDY_ID') ||
        (window.jatos && jatos.urlQueryParameters && jatos.urlQueryParameters.STUDY_ID) ||
        null,
        session_id:
        jsPsych.data.getURLVariable('SESSION_ID') ||
        (window.jatos && jatos.urlQueryParameters && jatos.urlQueryParameters.SESSION_ID) ||
        null
    };

    jsPsych.data.addProperties({
        subject_id: prolificParams.subject_id,
        study_id:   prolificParams.study_id,
        session_id: prolificParams.session_id,
        condition: CONDITION
    });

  <script>
    // experiment configuration
    const TOTAL_TRIALS = 40; // around 10 minutes
    const M_VALUES = [2, 4, 6, 8];

    const DIAMETER = 160;
    const GAP_BETWEEN = 30;
    const DOTS_PER_APERTURE = 100;
    const DOT_SPEED = 120; // px/sec
    const BLANK_DURATION = 500;
  const COHERENCE_LEVEL = .22; // change back 0.22
    
    const COH_DIR_OPTIONS = [0,45,90,135,180,225,270,315];

    // randomized condition assignment
    CONDITION = Math.random() < 0.5 ? "coherent" : "noise";

    // utilities
    function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function balanced_m_schedule(total, m_vals){
      const k = m_vals.length, base = Math.floor(total/k), rem = total % k, out = [];
      m_vals.forEach(m => { for (let i=0;i<base;i++) out.push(m); });
      shuffle(m_vals.slice()).slice(0,rem).forEach(m=>out.push(m));
      return shuffle(out);
    }

    function toggleProgressBar(show){
      const container = document.getElementById('jspsych-progressbar-container');
      if (!container) return;
      container.style.display = show ? 'block' : 'none';
    }

    let completedTrials = 0;

    const FULLSCREEN_EVENTS = ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'];

    function isFullscreenActive(){
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }

    const fullscreenGuard = (() => {
      let overlay = null;
      let paused = false;
      let enabled = false;

      function requestFullscreen(){
        const el = document.documentElement;
        let request;
        if (el.requestFullscreen) request = el.requestFullscreen();
        else if (el.webkitRequestFullscreen) request = el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen) request = el.mozRequestFullScreen();
        else if (el.msRequestFullscreen) request = el.msRequestFullscreen();
        if (request && typeof request.catch === 'function') {
          request.catch(() => {});
        }
      }

      function buildOverlay(){
        const wrapper = document.createElement('div');
        wrapper.className = 'fullscreen-overlay';
        wrapper.innerHTML = `
          <div class="fullscreen-overlay-content">
            <h2>Fullscreen Needed</h2>
            <p>The study runs in fullscreen to keep the display consistent. Please return to fullscreen to continue.</p>
            <button type="button" class="ui-button">Return to Fullscreen</button>
          </div>
        `;
        const btn = wrapper.querySelector('button');
        if (btn) {
          btn.addEventListener('click', requestFullscreen);
        }
        return wrapper;
      }

      function pauseExperiment(){
        if (paused) return;
        if (typeof jsPsych !== 'undefined' && jsPsych.pauseExperiment) {
          try { jsPsych.pauseExperiment(); paused = true; } catch (e) {}
        }
      }

      function resumeExperiment(){
        if (!paused) return;
        if (typeof jsPsych !== 'undefined' && jsPsych.resumeExperiment) {
          try { jsPsych.resumeExperiment(); paused = false; } catch (e) {}
        } else {
          paused = false;
        }
      }

      function showOverlay(){
        if (!enabled) return;
        if (!overlay) {
          overlay = buildOverlay();
          document.body.appendChild(overlay);
        }
        pauseExperiment();
      }

      function hideOverlay(){
        if (overlay) {
          overlay.remove();
          overlay = null;
        }
        resumeExperiment();
      }

      function handleChange(){
        if (!enabled) {
          if (overlay) hideOverlay();
          return;
        }
        if (isFullscreenActive()) hideOverlay();
        else showOverlay();
      }

      FULLSCREEN_EVENTS.forEach(evt => {
        document.addEventListener(evt, handleChange);
      });

      return {
        enable(){ enabled = true; handleChange(); },
        disable(){ enabled = false; hideOverlay(); },
        handleChange
      };
    })();

    function makeInfoScreen({ id, title, body, allowScroll = false, continueLabel = 'Continue' }){
      const scrollClass = allowScroll ? ' scrollable' : '';
      const buttonId = `${id}-continue`;
      return {
        type: "html-keyboard-response",
        stimulus: `
          <div class="instr welcome${scrollClass}">
            ${title ? `<h1>${title}</h1>` : ''}
            ${body}
            <div class="welcome-actions">
              <button id="${buttonId}" class="ui-button">${continueLabel}</button>
            </div>
          </div>` ,
        choices: jsPsych.NO_KEYS,
        on_load: function(){
          toggleProgressBar(false);
          const btn = document.getElementById(buttonId);
          const container = document.querySelector('.instr.welcome');
          if (container) container.scrollTop = 0;
          if (btn) {
            btn.addEventListener('click', function(){ jsPsych.finishTrial(); });
          }
        }
      };
    }

    var timeline = [];

    //welcome screen
    var landing = {
      type: "html-keyboard-response",
      stimulus: `
        <div class="instr welcome landing">
          <h1>Welcome</h1>
          <p>Welcome to our experiment. Please enter full screen before continuing.</p>
          <div class="welcome-actions center">
            <button id="enter-fs" class="ui-button">Enter Fullscreen</button>
          </div>
          <div id="landing-continue-wrapper" class="welcome-actions center" style="display:none;">
            <button id="landing-continue" class="ui-button">Continue</button>
          </div>
        </div>`,
      choices: jsPsych.NO_KEYS,
      on_load: function(){
        toggleProgressBar(false);
        fullscreenGuard.disable();
        var fsButton = document.getElementById('enter-fs');
        var continueWrapper = document.getElementById('landing-continue-wrapper');
        var continueBtn = document.getElementById('landing-continue');
        var events = FULLSCREEN_EVENTS.slice();

        function updateContinue(){
          if (!continueWrapper) return;
          continueWrapper.style.display = isFullscreenActive() ? 'block' : 'none';
        }

        events.forEach(function(evt){ document.addEventListener(evt, updateContinue); });
        updateContinue();
        fullscreenGuard.handleChange();

        if (fsButton) {
          fsButton.addEventListener('click', function(){
            var el = document.documentElement;
            var request;
            if (el.requestFullscreen) request = el.requestFullscreen();
            else if (el.webkitRequestFullscreen) request = el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) request = el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) request = el.msRequestFullscreen();
            else updateContinue();

            if (request && typeof request.then === 'function') {
              request.then(updateContinue).catch(function(){
                if (continueWrapper) continueWrapper.style.display = 'block';
              });
            } else {
              setTimeout(updateContinue, 200);
            }
          });
        }

        if (continueBtn) {
          continueBtn.addEventListener('click', function(){
            events.forEach(function(evt){ document.removeEventListener(evt, updateContinue); });
            jsPsych.finishTrial();
          });
        }
      }
    };
    timeline.push(landing);

    let purposeText;

    if (CONDITION === "coherent") {
      purposeText = `
        <p>Your task is to click on the circle you're most certain contains coherent motion.</p>
      `;
    } else {
      purposeText = `
        <p>Your task is to click on the circle you're most certain does not contain coherent motion.</p>
      `;
    }
    const infoScreens = [
      makeInfoScreen({
        id: 'introduction',
        title: 'Introduction',
        body: `
          <p>Hello and welcome to our experiment.</p>
          <p>Please make sure you can work for up to 20 minutes without interruption and avoid any distractions (i.e., TV, music, smartphones, children, cats).</p>
          <p>Please do not refresh the webpage during the experiment as you will not be able to restart or complete the experiment if you refresh.</p>
          <p>This experiment involves a motion perception task. Please read the instructions carefully and try to do the best you can.</p>
          <p><strong>What will you be doing in this experiment?</strong></p>
          <p>In this experiment we are interested in how well you can detect when dots move in the same direction, compared to dots moving randomly.</p>
          <p>During the experiment, you will be presented with either 2, 4, 6, or 8 circles containing containing many moving dots. A circle can contain coherent motion, meaning that some of its dots move in the same direction. ${purposeText}</p>
          <p>Please press Continue.</p>
        `
      }),
      makeInfoScreen({

    function make_rdk_trial(N, opts = {}){
      const isPractice = !!opts.isPractice;
      const practiceIndex = (typeof opts.practiceIndex === 'number') ? opts.practiceIndex : null;
      const POSITIONS = 8;
      const speedSetting = (typeof opts.speed === 'undefined') ? DOT_SPEED : opts.speed;

          }
          const vp = getAvailableViewport();
          const ringCx = vp.w / 2;
          const ringCy = vp.h / 2;

          const sinTerm8 = Math.sin(Math.PI / POSITIONS);
          const EDGE_PAD = 8;
          const horizClear = Math.min(ringCx, vp.w - ringCx) - EDGE_PAD;
          const vertClear  = Math.min(ringCy, vp.h - ringCy) - EDGE_PAD;
          const availR     = Math.min(horizClear, vertClear) - DIAMETER/2;
          const reqR8      = (DIAMETER + GAP_BETWEEN) / (2 * sinTerm8);

          let aperture_diam, ring_radius;
          if (reqR8 > availR) {
            aperture_diam = Math.max(80, 2 * sinTerm8 * (availR) - GAP_BETWEEN);
            ring_radius   = (aperture_diam + GAP_BETWEEN) / (2 * sinTerm8);
          } else {
            aperture_diam = DIAMETER;
            ring_radius   = reqR8;
          }

          const centers8 = [];
          for (let i=0;i<POSITIONS;i++){
            const angle = (i / POSITIONS) * 2 * Math.PI - Math.PI/2;
            centers8.push([
              ringCx + ring_radius * Math.cos(angle),
              ringCy + ring_radius * Math.sin(angle)
            ]);
          }

          const idxs = shuffle(Array.from({length: POSITIONS}, (_,i)=>i))
            .slice(0, N)
            .sort((a,b)=>a-b);

          const centers_x = idxs.map(i => centers8[i][0]);
          const centers_y = idxs.map(i => centers8[i][1]);
          const apertureLabels = idxs.map(i => i + 1);


          // NEW LOGIC: choose half the apertures to be coherent ---

          // number of coherent apertures (1 for N=2, 2 for N=4)
          const n_coherent = N / 2;

          // choose which of the N displayed apertures are coherent
          const coherent_indices = shuffle([...Array(N).keys()]).slice(0, n_coherent);

          // coherence array
          const coherence_arr = Array(N).fill(0);
          coherent_indices.forEach(i => coherence_arr[i] = COHERENCE_LEVEL);

          // choose a single coherent direction for all coherent apertures
          const coh_dir_deg = COH_DIR_OPTIONS[Math.floor(Math.random()*COH_DIR_OPTIONS.length)];
          const coherent_direction = Array(N).fill(0);
          coherent_indices.forEach(i => coherent_direction[i] = coh_dir_deg);

          // labels for correct choices (multiple)
          const correctLabels = coherent_indices.map(i => apertureLabels[i]);

          // assign to trial
          trial.aperture_labels = apertureLabels;
          trial.correct_choice = correctLabels;   // <-- now an array
          trial.number_of_dots = Array(N).fill(DOTS_PER_APERTURE);
          trial.coherence = coherence_arr;
          trial.coherent_direction = coherent_direction;
          trial.aperture_width = Array(N).fill(aperture_diam);
          trial.aperture_type = 1;
          trial.aperture_center_x = centers_x;
          trial.aperture_center_y = centers_y;
          trial.speed = speedSetting;
          trial._coh_dir_deg = coh_dir_deg;

          // data
          const phaseLabel = isPractice ? 'practice' : 'main';
          const trialData = {
            m: N,
            coherent_indices: coherent_indices,
            correct_labels: correctLabels,
            coh_level: COHERENCE_LEVEL,
            coh_dir_deg: coh_dir_deg,
            phase: phaseLabel,
            practice: isPractice
          };
          if (practiceIndex !== null) trialData.practice_index = practiceIndex;
          trial.data = trialData;
        },

        const cleaned = {};
        Object.keys(row).forEach(key => {
          if (columnsToOmit.has(key)) return;
          cleaned[key] = row[key];
        });
        cleaned.participant_ID = pid;
        cleaned.subject_id = cleaned.subject_id || prolificParams.subject_id || null;
        cleaned.study_id = cleaned.study_id || prolificParams.study_id || null;
        cleaned.session_id = cleaned.session_id || prolificParams.session_id || null;
        cleaned.condition = CONDITION;
        cleaned.demographics_sex = demographics.sex;
        cleaned.demographics_age = demographics.age;
        cleaned.demographics_serious = demographics.serious;
        cleaned.demographics_comments = demographics.comments;
        return cleaned;
      });
    }

    function exportResultJson(){
      const rows = buildSanitizedRows();
      return JSON.stringify(rows);
    }

    const jsPsychConfig = {
      timeline: timeline,
      show_progress_bar: true
    };
    if (window.jatos) {
      let abortButtonAdded = false;
      jsPsychConfig.on_trial_start = () => {
        if (!abortButtonAdded) {
          jatos.addAbortButton();
          abortButtonAdded = true;
        }
      };
      jsPsychConfig.on_finish = () => {
        const resultJson = exportResultJson();
        jatos.submitResultData(resultJson)
          .then(() => jatos.endStudy())
          .catch(err => {
            console.error("Failed to submit result data to JATOS", err);
            jatos.abortStudy(`Result submission failed: ${err}`);
          });
      };
      jatos.onLoad(() => {
        ensureParticipantIdAssigned();
        jsPsych.init(jsPsychConfig);
      });
    } else {
      ensureParticipantIdAssigned();
      jsPsych.init(jsPsychConfig);
    }
  </script>
</html>
